# EEIK Capability Matrix — CANONICAL
# Maps project-manifest fields → capability packs. Human-readable reference documentation.
#
# NOTE ON AUTHORITY: this matrix documents the field → pack mapping for humans. The *authoritative*
# resolution is implemented in code (`eeik/packs.py::resolve_packs`) because it must handle things a
# flat matrix cannot — top-level `cloud`/`ai`/`technology.data`, governance profiles, domain packs,
# and manifest `capability_packs` overrides. Keep this file in sync with that code.
#
# Availability: ✅ built (in capability-packs/) · 📋 planned (roadmap, not built)
# All 22 packs below are ✅ built as of v1.4 (go, node, retail added); azure/gcp are 📋 planned (ROADMAP v2.0).

backend:
  java:    { packs: [architecture-pack, java-pack] }       # ✅
  python:  { packs: [architecture-pack, python-pack] }     # ✅
  go:      { packs: [architecture-pack, go-pack] }         # ✅ cloud-native Go services
  node:    { packs: [architecture-pack, node-pack] }       # ✅ Node.js / TypeScript services
  mixed:   { packs: [architecture-pack, java-pack, python-pack] }  # ✅

frontend:
  react:   { packs: [react-pack] }     # ✅
  angular: { packs: [angular-pack] }   # ✅
  none:    { packs: [] }

cloud:                                 # top-level `cloud` in the schema (resolve_packs reads it there)
  aws:     { packs: [aws-pack] }       # ✅
  hybrid:  { packs: [aws-pack] }       # ✅ (aws primary)
  azure:   { packs: [azure-pack] }     # 📋 v2.0
  gcp:     { packs: [gcp-pack] }       # 📋 v2.0

# `technology.data.*` (streaming/batch/transformation/warehouse/orchestration) → data-engineering
data:
  any:     { packs: [data-engineering-pack] }   # ✅ activated when any technology.data field is set

# `technology.containerisation.runtime` (or a containers/k8s workload) → containers / openshift
platform:
  containers: { packs: [containers-pack] }   # ✅
  openshift:  { packs: [openshift-pack] }    # ✅ (also kubernetes)

architecture:
  monolith:         { packs: [architecture-pack] }              # ✅
  modular-monolith: { packs: [architecture-pack] }              # ✅
  microservices:    { packs: [architecture-pack] }              # ✅
  event-driven:     { packs: [architecture-pack] }              # ✅
  serverless:       { packs: [architecture-pack, aws-pack] }    # ✅
  agentic:          { packs: [architecture-pack, ai-engineering-pack, agent-harness-pack] }  # ✅

ai:                                    # top-level `ai` (ai.enabled activates ai-engineering + agent-harness)
  rag:                       { packs: [ai-engineering-pack, agent-harness-pack] }   # ✅
  single-agent:              { packs: [ai-engineering-pack, agent-harness-pack] }   # ✅
  multi-agent:               { packs: [ai-engineering-pack, agent-harness-pack] }   # ✅
  enterprise-agent-platform: { packs: [ai-engineering-pack, agent-harness-pack] }   # ✅
  none:                      { packs: [] }

governance:                            # profile regulated|enterprise → governance-pack
  basic:      { packs: [],                profile: basic,      reviews: [] }
  standard:   { packs: [],                profile: standard,   reviews: [architecture-review, security-review] }
  regulated:  { packs: [governance-pack], profile: regulated,  reviews: [architecture-review, security-review, production-readiness-review, compliance-review] }
  enterprise: { packs: [governance-pack], profile: enterprise, reviews: [architecture-review, security-review, arb-gate, production-readiness-review, compliance-review] }

domain:
  insurance:         { packs: [insurance-pack],         compliance_hints: [gdpr, solvency-ii] }        # ✅
  banking:           { packs: [banking-pack],           compliance_hints: [pci-dss, gdpr, basel-iii] } # ✅
  healthcare:        { packs: [healthcare-pack],        compliance_hints: [hipaa, gdpr] }              # ✅
  belgium-insurance: { packs: [belgium-insurance-pack], compliance_hints: [gdpr, solvency-ii] }        # ✅
  retail:            { packs: [retail-pack],            compliance_hints: [pci-dss, gdpr] }            # ✅
  generic:           { packs: [] }

modernization:                         # technology.mainframe.platform != none → modernization-pack
  ibmi:    { packs: [modernization-pack], agents: [ibmi-modernization-expert, modernization-architect] }  # ✅
  cobol:   { packs: [modernization-pack], agents: [modernization-architect] }                             # ✅
  rpg:     { packs: [modernization-pack], agents: [ibmi-modernization-expert] }                           # ✅
  none:    { packs: [] }

# Always active regardless of manifest: core-pack, delivery-pack (see resolve_packs).
always_active: [core-pack, delivery-pack]   # ✅

# AI-governance auto-trigger: governance_required = true when any of these match.
ai_governance_triggers:
  - domain: [insurance, banking, healthcare, belgium-insurance]
  - governance_profile: [regulated, enterprise]
  - ai_pattern: [multi-agent, enterprise-agent-platform]
