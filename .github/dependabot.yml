# Dependabot — keep the engine's Python deps and the GitHub Actions pinned in CI up to date.
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates
version: 2
updates:
  # Python engine dependencies (pyproject.toml extras: governance/mcp/test/dev).
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["dependencies", "python"]
    commit-message:
      prefix: "build(deps)"          # Conventional Commits (golden rule #8)
      prefix-development: "build(deps-dev)"
    groups:
      # Batch low-risk minor/patch bumps into one PR to reduce review load.
      python-minor-patch:
        update-types: ["minor", "patch"]

  # GitHub Actions used across .github/workflows/*.yml.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["dependencies", "github-actions"]
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions-minor-patch:
        update-types: ["minor", "patch"]
