name: Security Scan

on:
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 3 * * 1'  # Every Monday at 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write  # For uploading SARIF results to GitHub Security tab
  pull-requests: write

jobs:
  # ─── Secrets Scanning ───────────────────────────────────────────────────────
  secrets-scan:
    name: Secrets Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for commit scanning

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  # ─── Dependency Vulnerability Scan ──────────────────────────────────────────
  dependency-scan:
    name: Dependency Vulnerabilities
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Java (OWASP)
            check: java
          - name: Node / Angular (npm audit)
            check: node
          - name: Python (pip-audit)
            check: python
    steps:
      - uses: actions/checkout@v4

      - name: Java — OWASP Dependency Check
        if: matrix.check == 'java'
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: '${{ github.repository }}'
          path: '.'
          format: 'SARIF'
          args: >
            --failOnCVSS 7
            --enableRetired
        env:
          JAVA_HOME: /opt/jdk

      - name: Java — Upload SARIF
        if: matrix.check == 'java' && always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reports/dependency-check-report.sarif

      - name: Node — npm audit
        if: matrix.check == 'node'
        run: |
          if [ -f package.json ]; then
            npm audit --audit-level=high --json > npm-audit.json || true
            # Fail if HIGH or CRITICAL vulnerabilities found
            node -e "
              const report = require('./npm-audit.json');
              const vulns = report.metadata?.vulnerabilities || {};
              const critical = (vulns.critical || 0) + (vulns.high || 0);
              if (critical > 0) {
                console.error('FAIL: ' + critical + ' high/critical vulnerabilities found');
                process.exit(1);
              }
              console.log('PASS: No high/critical vulnerabilities');
            "
          else
            echo "No package.json found, skipping npm audit"
          fi

      - name: Python — pip-audit
        if: matrix.check == 'python'
        run: |
          if [ -f pyproject.toml ] || [ -f requirements.txt ]; then
            python -m pip install --upgrade pip-audit
            # Audit the project's declared dependencies (positional project path). pip-audit has no
            # --severity flag and its SARIF format varies by version; a plain project audit is portable
            # and its non-zero exit on a real vulnerability is the gate.
            pip-audit . --progress-spinner off
          else
            echo "No Python project found, skipping pip-audit"
          fi

  # ─── Container Image Scan ───────────────────────────────────────────────────
  container-scan:
    name: Container Vulnerability Scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image for scanning
        run: |
          if [ -f Dockerfile ]; then
            docker build -t scan-target:${{ github.sha }} .
          else
            echo "No Dockerfile found, skipping container scan"
            echo "SKIP_CONTAINER_SCAN=true" >> $GITHUB_ENV
          fi

      - name: Trivy — scan for vulnerabilities
        if: env.SKIP_CONTAINER_SCAN != 'true'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'scan-target:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Upload Trivy SARIF
        if: env.SKIP_CONTAINER_SCAN != 'true' && always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

  # ─── Static Analysis (CodeQL) ───────────────────────────────────────────────
  # Language-generic template: analyse only the languages actually present. This avoids CodeQL's
  # "configuration error" when, e.g., java-kotlin is in a fixed matrix but the repo has no Java to
  # build (the eeik-bootstrap engine repo is Python + a little JS/TS). Downstream products pick up
  # java-kotlin automatically once they contain Java.
  codeql-detect:
    name: CodeQL — detect languages
    runs-on: ubuntu-latest
    outputs:
      languages: ${{ steps.detect.outputs.languages }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect CodeQL languages present
        id: detect
        run: |
          has() { find . -path ./.git -prune -o -name "$1" -print 2>/dev/null | grep -q .; }
          langs=()
          if has '*.java' || has '*.kt' || [ -f pom.xml ] || [ -f build.gradle ] || [ -f build.gradle.kts ]; then
            langs+=("java-kotlin")
          fi
          # CodeQL's JS/TS extractor also covers inline scripts in .html, so include those.
          if has '*.ts' || has '*.tsx' || has '*.js' || has '*.jsx' || has '*.html' || [ -f package.json ]; then
            langs+=("javascript-typescript")
          fi
          if has '*.py' || [ -f pyproject.toml ]; then
            langs+=("python")
          fi
          if [ ${#langs[@]} -eq 0 ]; then
            echo 'languages=[]' >> "$GITHUB_OUTPUT"
          else
            json=$(printf '"%s",' "${langs[@]}")
            echo "languages=[${json%,}]" >> "$GITHUB_OUTPUT"
          fi
          echo "Detected CodeQL languages: ${langs[*]:-none}"

  codeql:
    name: CodeQL Static Analysis
    needs: codeql-detect
    if: needs.codeql-detect.outputs.languages != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJson(needs.codeql-detect.outputs.languages) }}
    steps:
      - uses: actions/checkout@v4

      - name: Initialise CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:${{ matrix.language }}'
