name: EEIK Validate

on:
  pull_request:
    paths:
      - 'project-manifest.yaml'
      - 'bootstrap/manifests/**'
      - 'capability-packs/**'
      - 'eeik/**'
      - 'scripts/**'
      - 'tests/**'
      - 'pyproject.toml'
  push:
    branches: [main, master]
    paths:
      - 'project-manifest.yaml'

jobs:
  validate-manifest:
    name: Validate Project Manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip

      - name: Install EEIK engine
        run: pip install -e .

      - name: Check manifest exists
        run: |
          if [ ! -f project-manifest.yaml ]; then
            echo "⚠ No project-manifest.yaml found."
            echo "This is expected for a bootstrap repo — skipping validation."
            exit 0
          fi

      - name: Validate manifest (strict mode on main)
        run: |
          if [ -f project-manifest.yaml ]; then
            if [ "${{ github.ref }}" = "refs/heads/main" ] || [ "${{ github.ref }}" = "refs/heads/master" ]; then
              python3 -m eeik validate --strict
            else
              python3 -m eeik validate
            fi
          fi

  check-packs:
    name: Verify Capability Packs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip

      - name: Install EEIK engine
        run: pip install -e .

      - name: Dry-run pack activation
        run: |
          if [ -f project-manifest.yaml ]; then
            python3 -m eeik activate --list
          else
            echo "No manifest — skipping pack check"
          fi

  engine-tests:
    name: Engine Tests + Drift Gate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install HALO runtime (halo-agent-harness) from git
        # HALO is not yet published to PyPI. Install it from the runtime repo so the `.[test]`
        # extra's `halo-agent-harness>=0.1.0` is already satisfied (keeping pyproject PyPI-publish-safe —
        # no direct-URL dependency in EEIK's own metadata). Remove once halo-agent-harness ships to PyPI.
        run: pip install "halo-agent-harness @ git+https://github.com/doubts-suplab/agent-harness@main#subdirectory=bindings/python"

      - name: Install EEIK engine (with test + governance extras)
        run: pip install -e ".[test]"

      - name: Run engine test suite (with coverage)
        run: >
          python3 -m pytest tests/ -q
          --cov=eeik --cov-report=term-missing --cov-report=xml --cov-fail-under=50

      - name: Governed-generation smoke test
        run: python3 -m eeik demo

      - name: Conformance gate (strict)
        run: python3 -m eeik verify --strict --exit-code

      - name: Capability-pack drift gate
        run: |
          if [ -f eeik.lock ]; then
            python3 -m eeik diff --exit-code
          else
            echo "No eeik.lock — skipping drift gate"
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          retention-days: 7

      - name: Collect diagnostic reports (on failure)
        if: failure()
        run: |
          # Capture the machine-readable state of the engine so a failed gate is debuggable from
          # the artifact alone — no need to re-run locally to see what drifted / failed conformance.
          mkdir -p ci-reports
          python3 -m eeik catalog --json  > ci-reports/catalog.json   2>&1 || true
          python3 -m eeik verify  --json  > ci-reports/verify.json    2>&1 || true
          python3 -m eeik doctor  --json  > ci-reports/doctor.json    2>&1 || true
          python3 -m eeik diff    --json  > ci-reports/diff.json      2>&1 || true

      - name: Upload diagnostic reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: eeik-diagnostics-${{ matrix.python-version }}
          path: ci-reports/
          retention-days: 7
          if-no-files-found: ignore

  lint-agents:
    name: Lint Agent Files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip

      - name: Install EEIK engine
        run: pip install -e .

      - name: Content lint (agents + standards)
        # Richer than a frontmatter grep: name-matches-file, description quality, model/tools, structure.
        run: python3 -m eeik lint --exit-code

      - name: Check for hardcoded secrets
        run: |
          # Scan for obvious credential patterns
          if grep -rE "(AKIA[0-9A-Z]{16}|password\s*=\s*['\"][^'\"]{4})" \
            --include="*.md" --include="*.yaml" --include="*.yml" \
            --exclude-dir=".git" .; then
            echo "FAIL: Potential credentials found in repository"
            exit 1
          fi
          echo "✓ No credential patterns detected"
