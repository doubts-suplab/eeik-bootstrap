title = "EEIK — gitleaks configuration"

# EEIK is a standards / security-education repository: several standards teach the
# "no hardcoded secrets" rule with a deliberately fake example of the ANTI-pattern
# (e.g. `String apiKey = "sk-live-abc123..."`). Those examples — and the generated
# tool-adapter files that project the standards verbatim — are NOT real secrets.
# We extend gitleaks' default ruleset and allowlist only these documentation cases,
# so a real leak elsewhere still fails the scan.

[extend]
useDefault = true

[allowlist]
description = "Teaching examples of the hardcoded-secret anti-pattern, and the generated adapters that project the standards."
regexTarget = "line"
# The exact fake values used in the golden-rules / security standards examples.
regexes = [
  '''sk-live-abc123''',
  '''SuperSecret123''',
]
# Generated tool adapters are machine projections of the standards (regenerated by
# `eeik generate-adapters`) — scan the source standards, not the projections.
paths = [
  '''\.windsurf/rules/.*''',
  '''\.clinerules/.*''',
  '''\.cursor/rules/.*''',
  '''\.kiro/.*''',
  '''AGENTS\.md''',
  '''GEMINI\.md''',
]
