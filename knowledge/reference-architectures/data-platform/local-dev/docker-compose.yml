# Local development stack for the Data Platform reference architecture.
# Kafka (ingestion) + MinIO (S3-compatible lakehouse) so you can run producers and Spark/dbt locally.
services:
  kafka:
    image: bitnami/kafka:3.6
    environment:
      KAFKA_CFG_NODE_ID: "0"
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      ALLOW_PLAINTEXT_LISTENER: "yes"
    ports: ["9092:9092"]

  # S3-compatible object store standing in for the lakehouse buckets.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: lakehouse
      MINIO_ROOT_PASSWORD: lakehouse_dev
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio-data:/data"]

  # One-shot: create the medallion buckets and load the bronze seed.
  minio-init:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 lakehouse lakehouse_dev; do sleep 1; done;
      mc mb -p local/bronze local/silver local/gold;
      mc cp /seed/events.bronze.jsonl local/bronze/events/events.jsonl;
      echo 'lakehouse buckets ready (bronze/silver/gold) + bronze seed loaded';
      "
    volumes:
      - ./seed:/seed:ro

volumes:
  minio-data:
