# Local development stack for the AI-Augmented Service reference architecture.
# Postgres + pgvector stands in for Aurora pgvector. Bedrock has no local emulator — point the service
# at real Bedrock with AWS creds, or stub the LLM/embedding ports (the HALO ports make this a one-liner).
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: knowledge
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag_dev
    ports: ["5432:5432"]
    volumes:
      - ./seed/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./seed/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d knowledge"]
      interval: 5s
      timeout: 3s
      retries: 10
