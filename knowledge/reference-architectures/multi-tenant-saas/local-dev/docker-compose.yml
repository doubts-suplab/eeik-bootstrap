# Local development stack for the Multi-Tenant SaaS reference architecture.
# Postgres stands in for Aurora; the schema ships the ROW-LEVEL SECURITY policies that enforce tenant
# isolation, plus two seeded tenants so you can prove isolation locally.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: saas
      POSTGRES_USER: saas
      POSTGRES_PASSWORD: saas_dev
    ports: ["5432:5432"]
    volumes:
      - ./seed/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./seed/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saas -d saas"]
      interval: 5s
      timeout: 3s
      retries: 10
