name: insurance-pack
version: "1.1"
status: built
category: domain
description: "Insurance domain — claims, underwriting, and Solvency II / GDPR compliance."
tags: [insurance, claims, underwriting, solvency-ii, gdpr, regulated, domain]

manifest_triggers:
  - field: project.domain
    value: insurance

agents_provided:
  - insurance-domain-expert

standards_provided:
  - insurance-compliance-standard

knowledge:
  - insurance-domain-glossary
  - insurance-business-rules
  - solvency-ii-reference

compliance_frameworks:
  - gdpr
  - solvency-ii
  - fca-conduct-rules

governance_override:
  minimum_profile: regulated   # insurance always requires regulated+

dependencies:
  - core-pack
  - architecture-pack
  - governance-pack
