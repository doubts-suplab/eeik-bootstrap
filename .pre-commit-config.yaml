# Pre-commit hooks — mirror the engine's CI gates locally so problems surface before push.
#   Install once:  pip install -e ".[dev]" && pre-commit install
#   Run manually:  pre-commit run --all-files
#
# What runs, and why it matches CI:
#   • ruff check        → the correctness/bugbear lint from [tool.ruff] (no reformatter; the engine's
#                          deliberate column-alignment is reviewed, not machine-rewritten).
#   • mypy              → the type config from [tool.mypy] (optional adapter deps are import-guarded).
#   • eeik lint         → the same content lint as the `lint-agents` job in eeik-validate.yml.
#   • eeik verify       → the same conformance gate as the `engine-tests` job (strict, exit-code).
# Formatting is intentionally lint-guided, not enforced by a wholesale formatter — see [tool.ruff.lint].
minimum_pre_commit_version: "3.5.0"
default_language_version:
  python: python3

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '\.md$'          # markdown uses trailing spaces for hard line breaks
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=512"]
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: ["--fix=lf"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff                  # lint (config in [tool.ruff]); no `ruff-format` by design
        args: ["--fix"]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        files: '^eeik/'
        additional_dependencies: ["types-PyYAML>=6.0"]

  # Engine content + conformance gates — run the real `eeik` CLI in the local env.
  - repo: local
    hooks:
      - id: eeik-lint
        name: eeik lint (agents + standards content)
        entry: python3 -m eeik lint --exit-code
        language: system
        pass_filenames: false
        files: '^(capability-packs/|\.claude/(agents|standards)/)'
      - id: eeik-verify
        name: eeik verify (conformance gate, strict)
        entry: python3 -m eeik verify --strict --exit-code
        language: system
        pass_filenames: false
        files: '^(capability-packs/|eeik/|bootstrap/|eeik\.lock)'
